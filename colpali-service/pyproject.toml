[project]
name = "breadboard-colpali"
version = "1.0.0"
description = "Breadboard's local ColPali service (visual page retrieval over attachments)."
requires-python = ">=3.10,<3.14"
dependencies = [
  "colpali-engine>=0.3.12,<0.4",
  "pillow>=10.0",
  "pydantic==2.13.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breadboard_colpali*"]
