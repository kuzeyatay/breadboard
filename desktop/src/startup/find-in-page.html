<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="find-in-page.css">
  <script src="find-in-page.js" defer></script>
</head>
<body>
  <form role="search" aria-label="Find in page">
    <input type="search" aria-label="Find in page" placeholder="Find in page" maxlength="1000" autocomplete="off" spellcheck="false">
    <span id="count" role="status" aria-live="polite"></span>
    <button id="previous" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 12 5-5 5 5"/></svg></button>
    <button id="next" type="submit" aria-label="Next match" title="Next match (Enter)" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></button>
    <button id="close" type="button" aria-label="Close find in page" title="Close (Esc)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8"/></svg></button>
  </form>
</body>
</html>
