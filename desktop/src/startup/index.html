<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Breadboard</title>
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./loading-scene.css" />
    <link rel="stylesheet" href="./startup.css" />
  </head>
  <body>
    <header class="desktop-titlebar" aria-label="Window controls"></header>
    <main class="shell">
      <section class="loader loading-scene" aria-label="Loading Breadboard">
        <!-- The startup chime. It begins the moment the screen stops loading
             and starts waiting on the dashboard, so it is already sounding by
             the time the welcome word arrives. Nothing to see: the loading
             field and the greeting are the whole picture. -->
        <audio id="intro-sound" preload="auto" disableremoteplayback>
          <source src="./intro.m4a" type="audio/mp4" />
        </audio>

        <div class="kinetic-stage" aria-hidden="true">
          <div class="stage-halo"></div>
          <div id="kinetic-field" class="kinetic-field"></div>
        </div>

        <section id="welcome" class="welcome" hidden>
          <div class="welcome-stage" aria-hidden="true">
            <p class="welcome-word"></p>
            <p class="welcome-word"></p>
          </div>
          <button
            id="welcome-continue"
            class="welcome-continue"
            type="button"
            aria-label="Continue to Breadboard"
          ></button>
        </section>

        <div id="dissolve-bloom" class="dissolve-bloom" aria-hidden="true"></div>

        <p id="phase-message" class="visually-hidden" aria-live="polite">
          Preparing Breadboard
        </p>
        <ul id="service-list" class="visually-hidden" aria-live="polite"></ul>

        <section id="failure" class="failure" hidden>
          <h2 id="failure-title">A service could not start</h2>
          <p id="failure-reason"></p>
          <details class="diagnostics">
            <summary>Diagnostic details</summary>
            <pre id="failure-log"></pre>
          </details>
          <div class="actions">
            <button id="retry-button" type="button">Retry</button>
            <button id="open-logs-button" type="button" class="secondary">Open logs</button>
            <button id="copy-diagnostics-button" type="button" class="secondary">Copy diagnostics</button>
            <button id="quit-button" type="button" class="secondary">Quit</button>
          </div>
        </section>
      </section>

      <footer class="visually-hidden">
        <span id="version-label"></span>
        <span class="local-note">Runs entirely on this computer</span>
      </footer>
    </main>
    <script src="./startup.js"></script>
  </body>
</html>
