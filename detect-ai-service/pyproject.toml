[project]
name = "breadboard-detect-ai"
version = "1.0.0"
description = "Breadboard's local, evidence-oriented AI-origin detector service."
requires-python = ">=3.10,<3.14"
dependencies = [
  "huggingface-hub==0.36.2",
  "open-clip-torch==2.32.0",
  "pillow==12.3.0",
  "safetensors==0.8.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "tqdm==4.70.0",
  "transformers==4.57.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["breadboard_detect_ai*"]
