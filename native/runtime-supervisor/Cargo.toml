[package]
name = "breadboard-runtime-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows Job Object containment helper for Breadboard desktop services"

[[bin]]
name = "runtime-supervisor"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
breadboard-runtime-core = { path = "../runtime-core" }
breadboard-runtime-protocol = { path = "../runtime-protocol" }
tempfile = "3"
