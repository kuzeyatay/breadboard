[package]
name = "breadboard-runtime-supervisor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows Job Object containment helper for Breadboard desktop services"

[[bin]]
name = "runtime-supervisor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

