[workspace]
resolver = "2"
members = [
  "runtime-core",
  "runtime-protocol",
  "runtime-supervisor",
  "runtime-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
