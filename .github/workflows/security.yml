name: Repository security
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      # This public monorepo contains legacy gitlinks without .gitmodules
      # entries. Fetch directly so no submodule credential setup runs. The
      # full index and commit graph remain available to both security checks.
      - name: Fetch public repository and security test inputs
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
          git sparse-checkout set --no-cone --stdin <<'PATTERNS'
          /.gitleaks.toml
          /scripts/check-repository-security.mjs
          /scripts/repository-security.test.mjs
          /dashboard/public/vvveb-editor/libs/media/openverse.js
          /Vvvebjs/libs/media/openverse.js
          PATTERNS
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 "$base/$archive" --output "$archive"
          curl --fail --location --retry 3 "$base/gitleaks_${version}_checksums.txt" --output checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: Check tracked paths and all new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" HEAD)
          elif [[ -z "$BASE_SHA" ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          node scripts/check-repository-security.mjs --base "$BASE_SHA"
      - name: Check security regression tests
        run: node --test scripts/repository-security.test.mjs
