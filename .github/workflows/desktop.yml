name: Desktop checks and installer

# Phase 1 of the production-readiness plan: every push proves the repository
# still installs and the fast suites still pass on a machine that is not the
# development workstation. The installer job is manual (or tag-triggered)
# because it needs ~10 GB of free disk and the full Python/Rust/Bun/uv
# toolchain; GitHub's hosted Windows runners are at the edge of that budget,
# so a larger or self-hosted Windows runner can be selected at dispatch time.
#
# Every build command runs as its own step: PowerShell does not stop a step
# when a native command fails, so one multi-command step hid four distinct
# failures behind a single exit code on the first run.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'qa/**/*.png'
      - 'qa/**/*.json'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the NSIS installer after the checks
        type: boolean
        default: false
      runner:
        description: Runner label for the installer job (needs ~10 GB free disk)
        type: string
        default: windows-latest

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast suites (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The hosted Windows image sets core.autocrlf=true, which rewrites every
      # text file on checkout and breaks byte-exact asset and lock receipts.
      - name: Keep checked-out bytes exact
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            desktop/package-lock.json
            quartz/package-lock.json
      - name: Install workspaces
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix dashboard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix quartz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Script tests
        shell: pwsh
        run: npm run test:scripts
      - name: Security regression tests
        shell: pwsh
        run: npm run security:test
      - name: Desktop shell compiles (main, preload, native helpers)
        shell: pwsh
        run: npm --prefix desktop run build
      - name: Desktop tests compile
        shell: pwsh
        run: npm --prefix desktop run test:build
      - name: Quartz unit tests
        shell: pwsh
        run: npm --prefix quartz test
      - name: Quartz production dependency audit
        shell: pwsh
        run: npm audit --prefix quartz --omit=dev

  installer:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    needs: checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    env:
      BREADBOARD_DESKTOP_RELEASE_DIR: ${{ github.workspace }}\release
      # The standalone dashboard build asks for an 11 GB heap plus a free-commit
      # reserve. A hosted runner has 16 GB of RAM and a small pagefile, so the
      # pagefile step below raises the commit limit and the reserve is pinned
      # to a size the runner can actually hold.
      BREADBOARD_MIN_FREE_COMMIT_MB: '2048'
    steps:
      - name: Keep checked-out bytes exact
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Raise the Windows pagefile for the dashboard build
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: 'D:'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          # prepare-runtimes.mjs downloads the CPython embeddable build that
          # matches the local interpreter's minor version (pinned to 3.13.x).
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.5'
      - name: Install workspaces
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix dashboard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix quartz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix hermes-agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location hermes-agent
          uv sync
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
      # Mirrors docs/DESKTOP_RELEASE_CHECKLIST.md steps 4 to 9, one step each.
      - name: Build the standalone dashboard
        shell: pwsh
        run: npm run desktop:build:dashboard
      - name: Build the native runtime supervisor
        shell: pwsh
        run: npm --prefix desktop run prepare:native-runtime
      - name: Stage runtimes
        shell: pwsh
        run: npm --prefix desktop run prepare:runtimes
      - name: Stage app resources
        shell: pwsh
        run: npm --prefix desktop run prepare:app
      - name: Stage transcription tools
        shell: pwsh
        run: npm --prefix desktop run prepare:transcription
      - name: Desktop test suite
        shell: pwsh
        run: npm run desktop:test
      - name: Verify staged resources
        shell: pwsh
        run: npm run desktop:verify
      - name: Package the NSIS installer
        shell: pwsh
        run: npm run desktop:dist:win
      - name: Verify the unpacked package
        shell: pwsh
        run: npm run desktop:verify
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Breadboard-Setup-x64
          path: release/Breadboard-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
