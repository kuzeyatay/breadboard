name: Desktop checks and installer

# Phase 1 of the production-readiness plan: every push proves the repository
# still installs and the fast suites still pass on a machine that is not the
# development workstation. The installer job is manual (or tag-triggered)
# because it needs ~12 GB of free disk and the full Python/Rust/Bun/uv
# toolchain; GitHub's hosted Windows runners are at the edge of that budget,
# so a larger or self-hosted Windows runner can be selected at dispatch time.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'qa/**/*.png'
      - 'qa/**/*.json'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the NSIS installer after the checks
        type: boolean
        default: false
      runner:
        description: Runner label for the installer job (needs ~12 GB free disk)
        type: string
        default: windows-latest

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast suites (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            desktop/package-lock.json
            quartz/package-lock.json
      - name: Install workspaces
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix dashboard
          npm ci --prefix desktop
          npm ci --prefix quartz
      - name: Script and security regression tests
        shell: pwsh
        run: |
          npm run test:scripts
          npm run security:test
      - name: Desktop shell compiles (main, preload, native helpers, tests)
        shell: pwsh
        run: |
          npm --prefix desktop run build
          npm --prefix desktop run test:build
      - name: Quartz unit tests
        shell: pwsh
        run: npm --prefix quartz test
      - name: Quartz production dependency audit
        # The release checklist requires zero advisories. The remaining ones
        # (katex, minimatch, satori, sharp, toml) need semver-major bumps that
        # must be reviewed by hand, so this step reports instead of failing
        # until those are landed.
        continue-on-error: true
        shell: pwsh
        run: npm audit --prefix quartz --omit=dev

  installer:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    needs: checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    env:
      BREADBOARD_DESKTOP_RELEASE_DIR: ${{ github.workspace }}\release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          # prepare-runtimes.mjs downloads the CPython embeddable build that
          # matches the local interpreter's minor version (pinned to 3.13.x).
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.5'
      - name: Install workspaces
        shell: pwsh
        run: |
          npm ci
          npm ci --prefix dashboard
          npm ci --prefix desktop
          npm ci --prefix quartz
          npm ci --prefix hermes-agent
          Push-Location hermes-agent
          uv sync
          Pop-Location
      - name: Build dashboard, stage runtimes, test, verify, package
        # Mirrors docs/DESKTOP_RELEASE_CHECKLIST.md steps 4 to 9.
        shell: pwsh
        run: |
          npm run desktop:build:dashboard
          npm run desktop:prepare
          npm run desktop:test
          npm run desktop:verify
          npm run desktop:dist:win
          npm run desktop:verify
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Breadboard-Setup-x64
          path: release/Breadboard-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
