name: Desktop checks and installer

# Phase 1 of the production-readiness plan: every push proves the repository
# still installs and the fast suites still pass on a machine that is not the
# development workstation. The installer job is manual (or tag-triggered)
# because it needs ~10 GB of free disk and the full Python/Rust/Bun/uv
# toolchain; GitHub's hosted Windows runners are at the edge of that budget,
# so a larger or self-hosted Windows runner can be selected at dispatch time.
#
# Every build command runs as its own step: PowerShell does not stop a step
# when a native command fails, so one multi-command step hid four distinct
# failures behind a single exit code on the first run.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'qa/**/*.png'
      - 'qa/**/*.json'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the NSIS installer after the checks
        type: boolean
        default: false
      runner:
        description: Runner label for the installer job (needs ~10 GB free disk)
        type: string
        default: windows-latest

permissions:
  contents: read

# A manual installer build must not be cancelled by the next push: dispatch
# runs and push runs keep separate groups.
concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast suites (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The hosted Windows image sets core.autocrlf=true, which rewrites every
      # text file on checkout and breaks byte-exact asset and lock receipts.
      - name: Keep checked-out bytes exact
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            desktop/package-lock.json
            quartz/package-lock.json
      - name: Install workspaces
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix dashboard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix quartz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Script tests
        shell: pwsh
        run: npm run test:scripts
      - name: Security regression tests
        shell: pwsh
        run: npm run security:test
      - name: Desktop shell compiles (main, preload, native helpers)
        shell: pwsh
        run: npm --prefix desktop run build
      - name: Desktop tests compile
        shell: pwsh
        run: npm --prefix desktop run test:build
      - name: Quartz unit tests
        shell: pwsh
        run: npm --prefix quartz test
      - name: Quartz production dependency audit
        shell: pwsh
        run: npm audit --prefix quartz --omit=dev

  installer:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' && inputs.build_installer
    needs: checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    env:
      BREADBOARD_DESKTOP_RELEASE_DIR: ${{ github.workspace }}\release
      # The standalone dashboard build asks for an 11 GB heap plus a free-commit
      # reserve. A hosted runner has 16 GB of RAM and a small pagefile, so the
      # pagefile step below raises the commit limit and the reserve is pinned
      # to a size the runner can actually hold.
      BREADBOARD_MIN_FREE_COMMIT_MB: '4096'
      # The runner's default TEMP is an 8.3 short path (RUNNER~1); Breadboard
      # refuses a data directory whose canonical path differs from the given one.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - name: Keep checked-out bytes exact
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Raise the Windows pagefile for the dashboard build
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: 'D:'
      - uses: actions/setup-node@v4
        with:
          # The bundled Node runtime is copied from the Node that runs the
          # packaging scripts, and mem0's native build is pinned to it.
          node-version: '24.14.1'
      - uses: actions/setup-python@v5
        with:
          # prepare-runtimes.mjs downloads the CPython embeddable build that
          # matches the local interpreter's minor version (pinned to 3.13.x).
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.5'
      - name: Install the Python the Agent Loop runtime is pinned to
        # prepare-app-resources.mjs pins the CPython 3.12.13 interpreter by
        # executable hash. That hash belongs to python-build-standalone release
        # 20260408 (the workstation's uv install); newer uv manifests pick a later
        # release, so the exact archive is fetched and verified here.
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "cpython-3.12.13-20260408.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260408/cpython-3.12.13+20260408-x86_64-pc-windows-msvc-install_only_stripped.tar.gz" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne "802162FB50165FC138DB0C737ABDA695E1CB819BFB52E4D230D14F8A5AF880B2") { Write-Error "unexpected archive hash $hash"; exit 1 }
          $dest = Join-Path $env:RUNNER_TEMP "agent-loop-python"
          New-Item -ItemType Directory -Force $dest | Out-Null
          tar -xzf $archive -C $dest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = Join-Path $dest "python"
          "BREADBOARD_AGENT_LOOP_PYTHON_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $root "python.exe") --version
      - name: Build the Premortem and Agent Loop environments the staging copies
        # prepare-app-resources.mjs stages these two services' site-packages from
        # a venv beside each checkout. The BREADBOARD_REQUIREMENTS_LOCK.txt files
        # are the workstation's frozen package sets; the venv interpreters are the
        # same uv-managed builds the staged runtimes use.
        shell: pwsh
        run: |
          uv venv --python 3.13.13 premortem/.venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip install --python premortem/.venv/Scripts/python.exe -r premortem/BREADBOARD_REQUIREMENTS_LOCK.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv venv --python (Join-Path $env:BREADBOARD_AGENT_LOOP_PYTHON_ROOT "python.exe") agent-loop-engineering-kit/.venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip install --python agent-loop-engineering-kit/.venv/Scripts/python.exe -r agent-loop-engineering-kit/BREADBOARD_REQUIREMENTS_LOCK.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install the Graft code-index toolchain the installer ships
        shell: pwsh
        run: |
          npm install -g @nanonets/graft@0.10.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = Join-Path (npm root -g).Trim() "@nanonets\graft"
          "BREADBOARD_GRAFT_PACKAGE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Download the reviewed prebuilt binaries
        # Voicebox's speech server and OpenCode are built on the maintainer
        # workstation and cannot be reproduced byte-for-byte here. The staging
        # script verifies both against their checked-in receipts (exact size
        # and SHA-256) before it ships them.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "prebuilt-binaries"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download prebuilt-binaries-2026-11-10 --pattern voicebox-server.exe --pattern opencode.exe --dir $dir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $voicebox = Join-Path $dir "voicebox-server.exe"
          "VOICEBOX_SERVER_BIN=$voicebox" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $opencode = "opencode/packages/opencode/dist/opencode-windows-x64/bin"
          New-Item -ItemType Directory -Force $opencode | Out-Null
          Move-Item (Join-Path $dir "opencode.exe") (Join-Path $opencode "opencode.exe")
      - name: Install workspaces
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix dashboard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix quartz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix hermes-agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location hermes-agent
          uv sync
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
          # The Google image-search MCP is a pnpm workspace; prepare-app-resources.mjs
          # copies its production dependency graph from its own node_modules.
          npm install -g pnpm@10.14.0-0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location mcp-google-images-search
          pnpm install --frozen-lockfile --prod --ignore-scripts
          $code = $LASTEXITCODE
          Pop-Location
          if ($code) { exit $code }
          # The Google Flow MCP is staged from its compiled dist and its
          # production dependency graph, both produced here from the pinned lock.
          npm ci --prefix google-flow-mcp --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build --prefix google-flow-mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The embedded API Anything runtime is bundled with esbuild from its
          # checkout; the bundle resolves zod, tldts and node-html-parser there.
          npm ci --prefix api-anything --ignore-scripts --omit=dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install the Codex coding agent the installer ships
        # prepare-app-resources.mjs stages codex.exe and its Windows helpers
        # from CODEX_BIN. The pinned version matches the workstation's staged
        # binaries; the npm package carries the platform build as an
        # optional dependency.
        shell: pwsh
        run: |
          npm install -g @openai/codex@0.151.0-alpha.7.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = (npm root -g).Trim()
          $codex = Get-ChildItem -Path $root -Recurse -Filter codex.exe -File |
            Where-Object { $_.FullName -match 'x86_64-pc-windows-msvc' } |
            Select-Object -First 1
          if (-not $codex) { Write-Error "codex.exe was not found under $root"; exit 1 }
          "CODEX_BIN=$($codex.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $codex.FullName --version
      # Mirrors docs/DESKTOP_RELEASE_CHECKLIST.md steps 4 to 9, one step each.
      - name: Build the standalone dashboard
        shell: pwsh
        run: npm run desktop:build:dashboard
      - name: Build the native runtime supervisor
        shell: pwsh
        run: npm --prefix desktop run prepare:native-runtime
      - name: Stage runtimes
        shell: pwsh
        run: npm --prefix desktop run prepare:runtimes
      - name: Stage app resources
        shell: pwsh
        run: npm --prefix desktop run prepare:app
      - name: Stage transcription tools
        shell: pwsh
        run: npm --prefix desktop run prepare:transcription
      - name: Desktop test suite
        # The hosted runner has no interactive desktop; Electron fixtures and
        # screen lanes run only on a developer machine.
        shell: pwsh
        env:
          BREADBOARD_DESKTOP_TEST_UNIT_ONLY: '1'
        run: npm run desktop:test
      - name: Verify staged resources
        shell: pwsh
        run: npm run desktop:verify
      - name: Package the NSIS installer
        # Signing is optional. With the WIN_CSC_LINK (base64 PFX) and
        # WIN_CSC_KEY_PASSWORD repository secrets set, electron-builder signs
        # Breadboard.exe and the installer; with them unset the build stays
        # unsigned exactly as before.
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run desktop:dist:win
      - name: Verify the unpacked package
        shell: pwsh
        run: npm run desktop:verify
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Breadboard-Setup-x64
          path: release/Breadboard-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
