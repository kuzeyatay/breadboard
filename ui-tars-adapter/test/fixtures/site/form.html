<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>UI-TARS Test Site — Contact Form</title>
  </head>
  <body>
    <h1 id="form-title">Contact form</h1>
    <form id="contact-form" method="POST" action="/submit">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <button id="submit-button" type="submit">Send message</button>
    </form>
    <p id="result"></p>
  </body>
</html>
