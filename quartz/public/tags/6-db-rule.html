  --bb-video-chrome: #f2f5f1;
  --bb-video-scrim: rgba(6, 10, 8, 0.62);
  margin: 1.4rem 0;
  border: 1px solid var(--lightgray);
  border-radius: 10px;
  background: color-mix(in srgb, var(--light) 90%, transparent);
  overflow: hidden;
}

.bb-video-stage {
  position: relative;
  display: block;
  background: #050706;
  line-height: 0;
}

.bb-video-stage--wide {
  aspect-ratio: 16/9;
}

.bb-video-media {
  display: block;

  height: auto;
  max-height: min(70vh, 34rem);
  object-fit: contain;
  background: #050706;
}

.bb-video-poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: pointer;
}

.bb-video--no-poster .bb-video-poster {
  display: none;
}

.bb-video--no-poster .bb-video-stage {
  background: linear-gradient(135deg, #10201a, #050706);
}

.bb-video-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.bb-video-play,
.bb-video-overlay {
  color: var(--bb-video-chrome);
  cursor: pointer;
  padding: 0;
}

.bb-video-play {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  width: 3.4rem;
  height: 3.4rem;
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-radius: 50%;
  background: var(--bb-video-scrim);
  backdrop-filter: blur(3px);
  transition: transform 160ms ease, background 160ms ease;
}

.bb-video-play svg {
  width: 1.3rem;
  height: 1.3rem;
  margin-left: 0.15rem;
  fill: currentColor;
}

.bb-video--youtube:hover .bb-video-play,
.bb-video-play:focus-visible {
  transform: translate(-50%, -50%) scale(1.06);
  background: color-mix(in srgb, var(--secondary) 84%, #050706);
}

.bb-video-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease;
}

.bb-video-overlay::before {
  content: &quot;&quot;;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 3.4rem;
  height: 3.4rem;
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-radius: 50%;
  background: var(--bb-video-scrim);
  backdrop-filter: blur(3px);
}

.bb-video-overlay svg {
  position: relative;
  width: 1.3rem;
  height: 1.3rem;
  margin-left: 0.15rem;
  fill: currentColor;
}

.bb-video[data-state=idle] .bb-video-overlay,
.bb-video[data-state=ended] .bb-video-overlay {
  opacity: 1;
  pointer-events: auto;
}

.bb-video-bar {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 1.1rem 0.55rem 0.45rem;
  background: linear-gradient(to top, rgba(4, 7, 6, 0.88), rgba(4, 7, 6, 0));
  line-height: 1;
  opacity: 0;
  transform: translateY(0.3rem);
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}

.bb-video--file:hover .bb-video-bar,
.bb-video--file:focus-within .bb-video-bar,
.bb-video[data-state=idle] .bb-video-bar,
.bb-video[data-state=paused] .bb-video-bar,
.bb-video[data-state=ended] .bb-video-bar {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.bb-video-btn {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 1.85rem;
  height: 1.85rem;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--bb-video-chrome);
  cursor: pointer;
  font: inherit;
  font-size: 0.72rem;
  transition: background 120ms ease;
}

.bb-video-btn svg {
  width: 1.05rem;
  height: 1.05rem;
  fill: currentColor;
}

.bb-video-btn:hover {
  background: rgba(255, 255, 255, 0.16);
}

.bb-video-speed {
  width: auto;
  min-width: 2.1rem;
  padding: 0 0.3rem;
  font-variant-numeric: tabular-nums;
}

.bb-video-time {
  flex: 0 0 auto;
  color: rgba(242, 245, 241, 0.88);
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.bb-video-bar :focus-visible {
  outline: 2px solid var(--tertiary);
  outline-offset: 1px;
}

.bb-video-seek {
  position: relative;
  flex: 1 1 auto;
  min-width: 3rem;
  height: 0.9rem;
  display: flex;
  align-items: center;
}

.bb-video-seek::before,
.bb-video-seek-buffered,
.bb-video-seek-played {
  content: &quot;&quot;;
  position: absolute;
  left: 0;
  top: 50%;
  height: 3px;
  border-radius: 999px;
  transform: translateY(-50%);
  pointer-events: none;
}

.bb-video-seek::before {
  right: 0;
  background: rgba(255, 255, 255, 0.2);
}

.bb-video-seek-buffered {
  width: 0;
  background: rgba(255, 255, 255, 0.34);
}

.bb-video-seek-played {
  width: 0;
  background: var(--tertiary);
}

.bb-video-seek-input {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 0.9rem;
  margin: 0;
  padding: 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.bb-video-seek-input::-webkit-slider-runnable-track {
  height: 0.9rem;
  background: transparent;
}

.bb-video-seek-input::-webkit-slider-thumb {
  appearance: none;
  width: 0.7rem;
  height: 0.7rem;
  margin-top: 0.1rem;
  border: 0;
  border-radius: 50%;
  background: var(--bb-video-chrome);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.bb-video-seek-input::-moz-range-track {
  height: 0.9rem;
  background: transparent;
}

.bb-video-seek-input::-moz-range-thumb {
  width: 0.7rem;
  height: 0.7rem;
  border: 0;
  border-radius: 50%;
  background: var(--bb-video-chrome);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
}

.bb-video-volume {
  flex: 0 0 auto;
  width: 3.6rem;
  height: 0.9rem;
  margin: 0;
  appearance: none;
  background: transparent;
  cursor: pointer;
}

.bb-video-volume::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
}

.bb-video-volume::-webkit-slider-thumb {
  appearance: none;
  width: 0.6rem;
  height: 0.6rem;
  margin-top: -0.15rem;
  border: 0;
  border-radius: 50%;
  background: var(--bb-video-chrome);
}

.bb-video-volume::-moz-range-track {
  height: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
}

.bb-video-volume::-moz-range-thumb {
  width: 0.6rem;
  height: 0.6rem;
  border: 0;
  border-radius: 50%;
  background: var(--bb-video-chrome);
}

.bb-video-caption {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.5rem 0.7rem;
  border-top: 1px solid var(--lightgray);
  color: var(--gray);
  font-size: 0.82rem;
  line-height: 1.4;
}

.bb-video-title {
  color: var(--dark);
  font-weight: 500;
  overflow-wrap: anywhere;
}

.bb-video-source {
  margin-left: auto;
  flex: 0 0 auto;
  color: var(--secondary);
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.bb-video-error {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  color: rgba(242, 245, 241, 0.86);
  font-size: 0.82rem;
  line-height: 1.4;
  text-align: center;
}

.bb-video-media--inline {
  max-width: 100%;
  border: 1px solid var(--lightgray);
  border-radius: 8px;
}

iframe.bb-video-media--inline {
  aspect-ratio: 16/9;
  width: min(100%, 34rem);
  height: auto;
}

.bb-video:fullscreen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: #050706;

}
.bb-video:fullscreen .bb-video-media {
  max-height: 100vh;
}
.bb-video:fullscreen .bb-video-caption {
  display: none;

  .bb-video-volume {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .bb-video-bar,
  .bb-video-overlay,
  .bb-video-play {
    transition: none;

pre:has(> code.breadboard-visual-noninteractive),
code.breadboard-visual-invalid,
code.breadboard-visual-noninteractive {
  display: none;
}

.breadboard-visual-card {
  margin: 1.4rem 0;
  border: 1px solid var(--lightgray);
  border-radius: 10px;
  background: color-mix(in srgb, var(--light) 90%, transparent);
  padding: 1rem 1.1rem 0.9rem 1.1rem;
}
.breadboard-visual-card .bv-kicker {
  margin: 0 0 0.1rem 0;
  color: var(--secondary);
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.breadboard-visual-card .bv-title {
  margin: 0 0 0.2rem 0;
  font-size: 1.05rem;
  color: var(--dark);
}
.breadboard-visual-card .bv-subtitle {
  margin: 0 0 0.4rem 0;
  color: var(--gray);
  font-size: 0.88rem;
}
.breadboard-visual-card .bv-figure {
  margin: 0.5rem 0;
}
.breadboard-visual-card .bv-figure .bv-svg {
  width: 100%;
  height: auto;
  display: block;
}
.breadboard-visual-card .bv-axis {
  stroke: var(--gray);
  stroke-width: 1;
  opacity: 0.65;
}
.breadboard-visual-card .bv-frame {
  stroke: var(--lightgray);
  stroke-width: 1;
}
.breadboard-visual-card .bv-marker {
  stroke: var(--tertiary);
  stroke-width: 1.5;
  stroke-dasharray: 5 4;
}
.breadboard-visual-card .bv-tick {
  fill: var(--gray);
  font-size: 12px;
}
.breadboard-visual-card .bv-solid {
  fill: var(--gray);
}
.breadboard-visual-card .bv-mass {
  fill: color-mix(in srgb, var(--secondary) 24%, var(--light));
  stroke: var(--secondary);
  stroke-width: 2;
}
.breadboard-visual-card .bv-mass-label {
  fill: var(--dark);
  font-size: 15px;
  font-weight: 600;
}
.breadboard-visual-card .bv-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 1rem;
  margin-top: 0.35rem;
  font-size: 0.8rem;
  color: var(--gray);
}
.breadboard-visual-card .bv-legend .bv-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.breadboard-visual-card .bv-legend .bv-swatch {
  display: inline-block;
  width: 14px;
  height: 4px;
  border-radius: 2px;
}
.breadboard-visual-card .bv-metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 0.55rem;
  margin-top: 0.4rem;
}
.breadboard-visual-card .bv-metric-card {
  border: 1px solid var(--lightgray);
  border-radius: 8px;
  padding: 0.55rem 0.6rem;
  background: color-mix(in srgb, var(--light) 82%, transparent);
}
.breadboard-visual-card .bv-metric-label {
  display: block;
  font-size: 0.72rem;
  color: var(--gray);
}
.breadboard-visual-card .bv-metric-value {
  display: block;
  margin-top: 0.1rem;
  color: var(--dark);
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
}
.breadboard-visual-card .bv-metric-bar {
  display: block;
  height: 5px;
  margin-top: 0.4rem;
  border-radius: 999px;
  background: var(--lightgray);
  overflow: hidden;
}
.breadboard-visual-card .bv-metric-fill {
  display: block;
  height: 100%;
  border-radius: inherit;
}
.breadboard-visual-card .bv-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 1.4rem;
  margin: 0.55rem 0 0.2rem 0;
  padding-top: 0.55rem;
  border-top: 1px dashed var(--lightgray);
}
.breadboard-visual-card .bv-control {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.84rem;
  color: var(--darkgray);
}
.breadboard-visual-card .bv-control input[type=range] {
  width: 130px;
  accent-color: var(--secondary);
}
.breadboard-visual-card .bv-control input[type=checkbox] {
  accent-color: var(--secondary);
}
.breadboard-visual-card .bv-control select {
  font: inherit;
  font-size: 0.84rem;
  border: 1px solid var(--lightgray);
  border-radius: 6px;
  background: var(--light);
  color: var(--dark);
  padding: 0.15rem 0.3rem;
}
.breadboard-visual-card .bv-control .bv-control-value {
  min-width: 2.6rem;
  color: var(--secondary);
  font-variant-numeric: tabular-nums;
}
.breadboard-visual-card .bv-caption {
  margin: 0.5rem 0 0 0;
  font-size: 0.88rem;
  color: var(--darkgray);
  font-style: italic;
}
.breadboard-visual-card .bv-source {
  margin: 0.3rem 0 0 0;
  font-size: 0.8rem;
  color: var(--gray);
}
.breadboard-visual-card .bv-readout {
  margin: 0.3rem 0 0 0;
  font-size: 0.82rem;
  color: var(--gray);
  font-variant-numeric: tabular-nums;
}
.breadboard-visual-card .bv-why {
  margin-top: 0.5rem;
  font-size: 0.85rem;
  color: var(--darkgray);
}
.breadboard-visual-card .bv-why summary {
  cursor: pointer;
  color: var(--secondary);
  font-weight: 500;
}
.breadboard-visual-card .bv-why p {
  margin: 0.35rem 0 0 0;
}
.breadboard-visual-card .bv-why .bv-annotation {
  color: var(--gray);
}
.breadboard-visual-card .bv-unsupported {
  margin: 0.3rem 0;
  color: var(--gray);
  font-size: 0.9rem;
}
.breadboard-visual-card .bv-footer {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  margin-top: 0.7rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--lightgray);
}
.breadboard-visual-card .bv-regenerate {
  border: 1px solid var(--lightgray);
  border-radius: 8px;
  background: color-mix(in srgb, var(--light) 88%, transparent);
  color: var(--secondary);
  cursor: pointer;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  line-height: 1;
  padding: 0.42rem 0.6rem;
}
.breadboard-visual-card .bv-regenerate:hover {
  color: var(--tertiary);
  border-color: var(--secondary);
}
.breadboard-visual-card .bv-regenerate:disabled {
  cursor: wait;
  opacity: 0.6;
}
.breadboard-visual-card .bv-status {
  font-size: 0.8rem;
  color: var(--gray);
}

.breadboard-generated-visual-card,
.breadboard-generated-visual-fallback {
  --viz-bg: var(--light);
  --viz-text: var(--dark);
  --viz-muted: var(--gray);
  --viz-line: var(--lightgray);
  --viz-control: color-mix(in srgb, var(--light) 86%, var(--lightgray));
  --viz-control-hover: color-mix(in srgb, var(--light) 70%, var(--lightgray));
  --viz-accent: var(--secondary);
  margin: 1.6rem 0;
  color: var(--viz-text);
}

.breadboard-generated-visual-card {
  width: 100%;
  min-width: 0;
  background: transparent;
}
.breadboard-generated-visual-card .bgv-frame {
  display: block;
  width: 100%;
  min-height: 420px;
  border: 0;
  background: var(--viz-bg);
}
.breadboard-generated-visual-card .bgv-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem 1.2rem;
  min-width: 0;
  border-top: 1px solid var(--viz-line);
  padding: 0.72rem 0;
  color: var(--viz-muted);
  font-size: 0.78rem;
}
.breadboard-generated-visual-card .bgv-provenance,
.breadboard-generated-visual-card .bgv-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.45rem 0.75rem;
  min-width: 0;
}
.breadboard-generated-visual-card .bgv-version {
  flex: none;
  font-family: var(--codeFont);
}
.breadboard-generated-visual-card .bgv-sources {
  min-width: 0;
  overflow-wrap: anywhere;
}
.breadboard-generated-visual-card .bgv-actions {
  flex: none;
  justify-content: flex-end;
}
.breadboard-generated-visual-card .bgv-action {
  border: 1px solid var(--viz-line);
  border-radius: 8px;
  background: var(--viz-control);
  color: var(--viz-text);
  padding: 0.4rem 0.72rem;
  cursor: pointer;
}
.breadboard-generated-visual-card .bgv-action:hover {
  background: var(--viz-control-hover);
}
.breadboard-generated-visual-card .bgv-action-primary {
  border-color: var(--viz-accent);
  background: var(--viz-accent);
  color: var(--light);
}
.breadboard-generated-visual-card .bgv-action:disabled {
  cursor: wait;
  opacity: 0.55;
}
.breadboard-generated-visual-card .bgv-action:focus-visible {
  outline: 2px solid var(--viz-accent);
  outline-offset: 3px;
}
.breadboard-generated-visual-card .bgv-status {
  max-width: 34ch;
  color: var(--viz-muted);
}

.breadboard-generated-visual-fallback {
  border-block: 1px solid var(--viz-line);
  padding: 0.9rem 0;
}
.breadboard-generated-visual-fallback p {
  margin: 0.3rem 0 0;
  color: var(--viz-muted);
}

@media (prefers-reduced-motion: reduce) {
  .breadboard-generated-visual-card * {
    transition-duration: 0.01ms !important;
  }
}
@media (max-width: 520px) {
  .breadboard-generated-visual-card .bgv-frame {
    min-height: 320px;
  }
  .breadboard-generated-visual-card .bgv-meta {
    align-items: flex-start;
    flex-direction: column;
  }
  .breadboard-generated-visual-card .bgv-actions {
    justify-content: flex-start;

  margin: 0;

.penecho-board,
.penecho-board-fallback {
  margin: 1.4rem 0;
  border: 1px solid var(--lightgray);
  border-radius: 12px;
  background: color-mix(in srgb, var(--light) 92%, white);
  color: var(--dark);
  overflow: hidden;
}

.penecho-board {
  display: flex;
  flex-direction: column;
}
.penecho-board .penecho-board-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 0.9rem;
  cursor: pointer;
  user-select: none;
}
.penecho-board .penecho-board-heading {
  min-width: 0;
}
.penecho-board .penecho-board-kicker {
  margin: 0 0 0.12rem;
  color: var(--secondary);
  font-size: 0.72rem;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.penecho-board .penecho-board-title {
  margin: 0;
  overflow: hidden;
  font-size: 1.05rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.penecho-board .penecho-board-action {
  flex: none;
  border: 1px solid var(--lightgray);
  border-radius: 8px;
  padding: 0.4rem 0.7rem;
  background: color-mix(in srgb, var(--light) 88%, transparent);
  color: var(--secondary);
  cursor: pointer;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  line-height: 1;
}
.penecho-board .penecho-board-action:hover {
  border-color: var(--secondary);
  color: var(--tertiary);
}
.penecho-board .penecho-board-surface {
  position: relative;
  height: var(--penecho-board-height, 520px);
  border-top: 1px solid var(--lightgray);
  background-color: #fbfbf9;
  background-image: linear-gradient(color-mix(in srgb, var(--lightgray) 45%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--lightgray) 45%, transparent) 1px, transparent 1px);
  background-size: 26px 26px;
  box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.06);
}
.penecho-board .penecho-board-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  padding: 1rem;
  text-align: center;
}
.penecho-board .penecho-board-placeholder-text {
  margin: 0;
  max-width: 32rem;
  color: var(--gray);
  font-size: 0.88rem;
}
.penecho-board .penecho-board-frame {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}
.penecho-board.penecho-board--mounted .penecho-board-placeholder {
  display: none;
}

.penecho-board.penecho-board--expanded {
  position: fixed;
  inset: 0;
  z-index: 900;
  margin: 0;
  border: 0;
  border-radius: 0;
}
.penecho-board.penecho-board--expanded .penecho-board-surface {
  flex: 1;
  height: auto;
  min-height: 0;
}

.penecho-board-spacer {
  margin: 1.4rem 0;
}

html.penecho-board-open {
  overflow: hidden;
}

.penecho-board-fallback {
  padding: 0.9rem 1.1rem;
}
.penecho-board-fallback strong {
  display: block;
  margin-bottom: 0.25rem;
}
.penecho-board-fallback p {
  margin: 0;
  color: var(--gray);
  font-size: 0.88rem;
}

      .trim()
    let unicodeSafe = ""
    for (let index = 0; index < text.length; index += 1) {
      const code = text.charCodeAt(index)

        const next = text.charCodeAt(index + 1)

    if (

    const visibleCount =

    return Number.isFinite(number) ? number : fallback
  }

  const safeLanguage = (value) => {
    const candidate = typeof value === "string" ? value.trim() : ""
    if (!candidate || candidate.length > 64) return "en"
    try {
      return Intl.getCanonicalLocales(candidate)[0] || "en"
    } catch {
      return "en"
    }
  }

  const evaluate = (expression, state) => {
    if (!expression || typeof expression !== "object") return 0
    if (expression.kind === "constant") return finite(expression.value)
    if (expression.kind === "input") return finite(state[expression.id])
    if (expression.kind === "binary") {
      const left = evaluate(expression.left, state)
      const right = evaluate(expression.right, state)
      if (expression.op === "add") return left + right
      if (expression.op === "subtract") return left - right
      if (expression.op === "multiply") return left * right
      if (expression.op === "divide") return right === 0 ? Number.NaN : left / right
      if (expression.op === "power") return Math.pow(left, right)
      if (expression.op === "min") return Math.min(left, right)
      return Math.max(left, right)
    }
    if (expression.kind === "unary") {
      const value = evaluate(expression.argument, state)
      if (expression.op === "negate") return -value
      if (expression.op === "abs") return Math.abs(value)
      if (expression.op === "sqrt") return Math.sqrt(value)
      if (expression.op === "sin") return Math.sin(value)
      if (expression.op === "cos") return Math.cos(value)
      if (expression.op === "tan") return Math.tan(value)
      if (expression.op === "exp") return Math.exp(value)
      return Math.log(value)
    }
    if (expression.kind === "clamp") {
      return Math.max(
        evaluate(expression.min, state),
        Math.min(evaluate(expression.max, state), evaluate(expression.value, state)),
      )
    }
    if (expression.kind === "conditional") {
      const left = evaluate(expression.left, state)
      const right = evaluate(expression.right, state)
      const matches =
        expression.comparison === "lt"
          ? left < right
          : expression.comparison === "lte"
            ? left <= right
            : expression.comparison === "gt"
              ? left > right
              : expression.comparison === "gte"
                ? left >= right
                : left === right
      return evaluate(matches ? expression.whenTrue : expression.whenFalse, state)
    }
    return 0
  }

  const renderPlot = (scene, state) => {
    const host = element("section", "gv-scene")
    host.appendChild(element("h3", undefined, scene.title))
    const svg = svgElement("svg", {
      viewBox: "0 0 640 340",
      class: "gv-svg",
      role: "img",
      "aria-label": scene.title,
    })
    const margin = { left: 64, right: 18, top: 18, bottom: 68 }
    const width = 640 - margin.left - margin.right
    const height = 340 - margin.top - margin.bottom
    const seriesValues = []
    const yValues = []
    for (const series of scene.series) {
      const points = []
      for (let index = 0; index < scene.samples; index += 1) {
        const x = scene.xMin + ((scene.xMax - scene.xMin) * index) / Math.max(1, scene.samples - 1)
        const y = evaluate(series.expression, { ...state, x })
        if (Number.isFinite(y)) {
          points.push({ x, y })
          yValues.push(y)
        }
      }
      seriesValues.push({ series, points })
    }
    const rawMin = yValues.length ? Math.min(...yValues) : -1
    const rawMax = yValues.length ? Math.max(...yValues) : 1
    const padding = Math.max(1e-6, (rawMax - rawMin) * 0.12)
    const yMin = rawMin === rawMax ? rawMin - 1 : rawMin - padding
    const yMax = rawMin === rawMax ? rawMax + 1 : rawMax + padding
    const sx = (x) => margin.left + ((x - scene.xMin) / (scene.xMax - scene.xMin)) * width
    const sy = (y) => margin.top + height - ((y - yMin) / (yMax - yMin)) * height
    for (let index = 0; index <= 4; index += 1) {
      const y = margin.top + (height * index) / 4
      svg.appendChild(
        svgElement("line", {
          x1: margin.left,
          y1: y,
          x2: margin.left + width,
          y2: y,
          class: "gv-grid",
        }),
      )
      const yTick = svgElement("text", {
        x: margin.left - 8,
        y: y + 5,
        class: "gv-tick",
        "text-anchor": "end",
      })
      yTick.textContent = format(yMax - ((yMax - yMin) * index) / 4, 2)
      svg.appendChild(yTick)
      const x = margin.left + (width * index) / 4
      const xTick = svgElement("text", {
        x,
        y: margin.top + height + 22,
        class: "gv-tick",
        "text-anchor": "middle",
      })
      xTick.textContent = format(scene.xMin + ((scene.xMax - scene.xMin) * index) / 4, 2)
      svg.appendChild(xTick)
    }
    svg.appendChild(
      svgElement("line", {
        x1: margin.left,
        y1: margin.top + height,
        x2: margin.left + width,
        y2: margin.top + height,
        class: "gv-axis",
      }),
    )
    svg.appendChild(
      svgElement("line", {
        x1: margin.left,
        y1: margin.top,
        x2: margin.left,
        y2: margin.top + height,
        class: "gv-axis",
      }),
    )
    const palette = [
      "var(--viz-accent)",
      "var(--viz-text)",
      "var(--viz-muted)",
      "var(--viz-spatial-violet)",
      "var(--viz-spatial-amber)",
      "var(--viz-spatial-cyan)",
    ]
    seriesValues.forEach(({ series, points }, index) => {
      const polyline = svgElement("polyline", {
        points: points
          .map((point) => \`\${sx(point.x).toFixed(2)},\${sy(point.y).toFixed(2)}\`)
          .join(" "),
        class: "gv-line",
        stroke: series.color || palette[index % palette.length],

      const title = svgElement("title")
      title.textContent = series.label
      polyline.appendChild(title)
      svg.appendChild(polyline)
    })

      const circle = svgElement("circle", {
        cx: sx(x),
        cy: sy(y),

      circle.appendChild(title)
      svg.appendChild(circle)
    })

    xLabel.textContent = scene.xLabel
    svg.appendChild(xLabel)
    const yLabel = svgElement("text", {

      class: "gv-label",

    host.appendChild(svg)

  }

  const renderDiagram = (scene, state) => {
    const host = element("section", "gv-scene")
    host.appendChild(element("h3", undefined, scene.title))
    const svg = svgElement("svg", {
      viewBox: "0 0 640 360",
      class: "gv-svg",

      "aria-label": scene.title,
    })
    const markerId = \`gv-arrow-\${(diagramCounter += 1)}\`
    const defs = svgElement("defs")
    const marker = svgElement("marker", {
      id: markerId,
      viewBox: "0 0 10 10",
      refX: 9,
      refY: 5,
      markerWidth: 7,
      markerHeight: 7,
      orient: "auto-start-reverse",
    })
    marker.appendChild(svgElement("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "var(--muted)" }))
    defs.appendChild(marker)
    svg.appendChild(defs)
    const renderedNodes = scene.nodes.map((node) => ({
      ...node,
      x: Math.max(72, Math.min(568, finite(node.x, 320))),
      y: Math.max(48, Math.min(312, finite(node.y, 180))),
    }))
    const nodes = new Map(renderedNodes.map((node) => [node.id, node]))
    for (const edge of scene.edges) {
      const from = nodes.get(edge.from)
      const to = nodes.get(edge.to)
      if (!from || !to) continue
      const strength = edge.strength
        ? Math.max(0.5, Math.min(6, Math.abs(evaluate(edge.strength, state))))
        : 1.5
      const dx = to.x - from.x
      const dy = to.y - from.y
      const length = Math.max(1, Math.hypot(dx, dy))
      const startInset = from.shape === "rect" ? 48 : 32
      const endInset = to.shape === "rect" ? 52 : 38
      svg.appendChild(
        svgElement("line", {
          x1: from.x + (dx / length) * startInset,
          y1: from.y + (dy / length) * startInset,
          x2: to.x - (dx / length) * endInset,
          y2: to.y - (dy / length) * endInset,
          class: "gv-edge",
          "stroke-width": strength,
          ...(edge.directed ? { "marker-end": \`url(#\${markerId})\` } : {}),
        }),
      )
      if (edge.label) {
        const label = svgElement("text", {
          x: (from.x + to.x) / 2,
          y: (from.y + to.y) / 2 - 6,
          class: "gv-label",
        })
        label.textContent = edge.label
        svg.appendChild(label)
      }
    }
    for (const node of renderedNodes) {
      if (node.shape === "rect")
        svg.appendChild(
          svgElement("rect", {
            x: node.x - 48,
            y: node.y - 25,
            width: 96,
            height: 50,
            rx: 9,
            class: "gv-node",
          }),
        )
      else
        svg.appendChild(svgElement("circle", { cx: node.x, cy: node.y, r: 32, class: "gv-node" }))
      const value = node.value ? \` \${format(evaluate(node.value, state), 2)}\` : ""
      const words = \`\${node.label}\${value}\`.trim().split(/\\s+/)
      const lines = []
      for (const word of words) {
        const current = lines[lines.length - 1]
        if (!current || \`\${current} \${word}\`.length > 14) lines.push(word)
        else lines[lines.length - 1] = \`\${current} \${word}\`
      }
      const label = svgElement("text", {
        x: node.x,
        y: node.y - (lines.length - 1) * 8 + 4,
        class: "gv-label gv-node-label",
      })
      lines.slice(0, 3).forEach((line, index) => {
        const span = svgElement("tspan", { x: node.x, dy: index === 0 ? 0 : 16 })
        span.textContent = line
        label.appendChild(span)
      })
      svg.appendChild(label)
    }
    host.appendChild(svg)
    return host
  }
